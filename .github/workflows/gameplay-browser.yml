name: LOWTOWN Gameplay Browser Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

jobs:
  browser-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: 15s continuous AI motion capture
        run: node tests/ai-15s-browser-smoke.mjs
      - name: End-to-end DROP payout and DIST gate
        run: node tests/gameplay-browser-acceptance.mjs
      - name: Mobile + desktop visual regression guard
        run: node tests/visual-regression-browser.mjs
      - name: Upload visual guard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-visual-guard
          path: test-results/visual-*.png
          if-no-files-found: ignore
