name: LOWTOWN Sandbox Gameplay Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

jobs:
  sandbox-gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Human controls
        run: node tests/human-controls-regression.mjs
      - name: Air medical response
        run: npm run test:air-medical
      - name: Street signals and resident behavior
        run: npm run test:living-world
      - name: Stable crowd movement and populated emergency routes
        run: npm run test:movement-stability
      - name: Live traffic
        run: node tests/live-traffic-regression.mjs
      - name: Pedestrian motion
        run: node tests/pedestrian-motion-regression.mjs
      - name: Aircraft flight
        run: node tests/plane-flight-regression.mjs
      - name: Street depth order
        run: node tests/street-depth-regression.mjs
      - name: Traffic turns
        run: node tests/traffic-turns-regression.mjs
      - name: Private drive
        run: node tests/private-drive-smoke.mjs
      - name: Free roam rendering
        run: node tests/free-roam-render-smoke.mjs
      - name: Pedestrian world
        run: node tests/pedestrian-world-smoke.mjs
      - name: Expanded city world
        run: node tests/huge-world-smoke.mjs
