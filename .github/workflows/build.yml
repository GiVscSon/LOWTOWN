name: Build LOWTOWN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Test road topology first
        run: node tests/road-topology-smoke.mjs
      - name: Diagnose world connectivity
        run: node tests/world-connectivity-diagnostic.mjs
      - name: Stress-test world routing
        run: node tests/world-stress-smoke.mjs
      - name: Test ferry and island transport
        run: node tests/transport-smoke.mjs
      - name: Run island topology smoke test
        run: node tests/islands-smoke.mjs
      - name: Run navigation brain smoke test
        run: node tests/navigation-brain-smoke.mjs
      - name: Run city director smoke test
        run: node tests/city-director-smoke.mjs
      - name: Run AI safety layer smoke test
        run: node tests/ai-safety-layer-smoke.mjs
      - name: Run AI diagnostics smoke test
        run: node tests/ai-diagnostics-smoke.mjs
      - name: Run AI expansion smoke test
        run: node tests/ai-expansion-smoke.mjs
      - name: Run scenario generator smoke test
        run: node tests/scenario-generator-smoke.mjs
      - name: Run scenario benchmark smoke test
        run: node tests/benchmark-smoke.mjs
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run autonomous driving smoke test
        run: node tests/autopilot-smoke.mjs
      - name: Upload autonomous AI telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-ai-telemetry
          path: ai-run-artifacts/
          if-no-files-found: ignore
          retention-days: 14
