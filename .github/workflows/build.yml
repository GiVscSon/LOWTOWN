name: Build LOWTOWN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Test vehicle physics
        run: node tests/vehicle-physics-smoke.mjs
      - name: Test unified transport physics
        run: node tests/transport-physics-smoke.mjs
      - name: Test transport profiles
        run: node tests/transport-profiles-smoke.mjs
      - name: Test separated transport physics
        run: node tests/transport-separated-physics-smoke.mjs
      - name: Test direct AI transport integration
        run: node tests/ai-transport-integration-smoke.mjs
      - name: Test physics prediction kernel
        run: node tests/physics-prediction-smoke.mjs
      - name: Test vehicle safety and actuator dynamics
        run: node tests/vehicle-safety-smoke.mjs
      - name: Test calibration acceptance gate
        run: node tests/calibration-acceptance-smoke.mjs
      - name: Test dynamic bicycle
        run: node tests/dynamic-bicycle-smoke.mjs
      - name: Test transport contact chain
        run: node tests/transport-contact-trace-smoke.mjs
      - name: Test transport AI closed-loop stress
        run: node tests/transport-ai-closed-loop-stress.mjs
      - name: Test transport AI closed-loop matrix
        run: node tests/transport-ai-closed-loop-matrix.mjs
      - name: Test physics diagnostics
        run: node tests/physics-diagnostics-smoke.mjs
      - name: Test physics calibration
        run: node tests/physics-calibration-smoke.mjs
      - name: Test physics calibration closed loop
        run: node tests/physics-calibration-closed-loop-smoke.mjs
      - name: Run calibration lab
        run: node tests/calibration-lab.mjs
      - name: Test persistent world state
        run: node tests/world-state-smoke.mjs
      - name: Test road topology first
        run: node tests/road-topology-smoke.mjs
      - name: Diagnose world connectivity
        run: node tests/world-connectivity-diagnostic.mjs
      - name: Stress-test world routing
        run: node tests/world-stress-smoke.mjs
      - name: Test ferry and island transport
        run: node tests/transport-smoke.mjs
      - name: Run island topology smoke test
        run: node tests/islands-smoke.mjs
      - name: Run navigation brain smoke test
        run: node tests/navigation-brain-smoke.mjs
      - name: Run free-will driver smoke test
        run: node tests/free-will-driver-smoke.mjs
      - name: Run autonomy stack smoke test
        run: node tests/autonomy-stack-smoke.mjs
      - name: Run city director smoke test
        run: node tests/city-director-smoke.mjs
      - name: Run AI safety layer smoke test
        run: node tests/ai-safety-layer-smoke.mjs
      - name: Run AI diagnostics smoke test
        run: node tests/ai-diagnostics-smoke.mjs
      - name: Run AI expansion smoke test
        run: node tests/ai-expansion-smoke.mjs
      - name: Run scenario generator smoke test
        run: node tests/scenario-generator-smoke.mjs
      - name: Run corridor guardian smoke test
        run: node tests/corridor-guardian-smoke.mjs
      - name: Run Black Box telemetry smoke test
        run: node tests/black-box-telemetry-smoke.mjs
      - name: Run scenario feedback smoke test
        run: node tests/scenario-feedback-smoke.mjs
      - name: Run trajectory lab smoke test
        run: node tests/trajectory-lab-smoke.mjs
      - name: Run turn arbitration integration smoke test
        run: node tests/turn-arbitration-smoke.mjs
      - name: Run scenario benchmark smoke test
        run: node tests/benchmark-smoke.mjs
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run autonomous driving smoke test
        run: node tests/autopilot-smoke.mjs
      - name: Run real closed-loop 20-scenario lab
        run: LOWTOWN_SCENARIOS=20 LOWTOWN_SCENARIO_RUN_MS=12000 node tests/closed-loop-scenario-lab.mjs
      - name: Run real browser physics calibration lab
        run: LOWTOWN_CALIBRATION_SCENARIOS=8 LOWTOWN_CALIBRATION_RUN_MS=6000 node tests/physics-calibration-browser-lab.mjs
      - name: Upload autonomous AI telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-ai-telemetry
          path: ai-run-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload closed-loop scenario lab
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-scenario-lab
          path: scenario-lab-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload physics calibration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-physics-calibration
          path: physics-calibration-artifacts/
          if-no-files-found: ignore
          retention-days: 14
