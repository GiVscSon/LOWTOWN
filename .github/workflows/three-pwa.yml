name: LOWTOWN Three PWA

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - package.json
      - package-lock.json
      - public/manifest.webmanifest
      - public/pwa-icon.svg
      - public/sw.js
      - src/main.js
      - src/app/pwa.js
      - src/render/**
      - src/runtime/**
      - src/simulation/**
      - src/world/**
      - src/ui/**
      - src/app/**
      - src/assets/**
      - tests/matrix/**
      - src/world/street_surface.js
      - src/render/shared/street_vehicle.js
      - src/assets/vehicle_shapes.js
      - tests/refined-transport*.mjs
      - tests/fixtures/refined-transport.html
      - tests/crosswalk-markings-regression.mjs
      - scripts/pwa-icons.mjs
      - vite.config.js
      - tests/three-city-geometry.mjs
      - tests/three-pwa-*.mjs
      - tests/game-menu-browser-smoke.mjs
      - tests/street-*graphics*.mjs
      - .github/workflows/three-pwa.yml
  workflow_dispatch:

jobs:
  three-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Runtime, terrain, contact and graphics matrix
        run: npm run test:quality-matrix
      - name: Day cycle, weather, bounded sound effects and face detail
        run: node tests/matrix/climate-sound.mjs
      - name: Populated city and safe emergency return after bridge contacts
        run: npm run test:movement-stability
      - name: Residents, beaches and swimming routes
        run: npm run test:living-world
      - run: npm run test:three-pwa-contract
      - run: node tests/three-city-geometry.mjs
      - run: npm run test:refined-transport
      - run: npm run test:street-graphics
      - run: npm run test:organic-streets
      - run: node tests/crosswalk-markings-regression.mjs
      - run: npx playwright install --with-deps chromium
      - name: Full graphics, weather, settings and mobile matrix
        run: npm run test:quality-browser
      - name: Jump, melee, movable props, particles and touch controls
        run: npm run test:interaction-browser
      - name: Coastal swimming, weapon reactions and touch controls
        run: npm run test:coastal-browser
      - name: People types, audible radio, wet reflections and pursuit beam
        run: npm run test:living-city-upgrade-browser
      - name: Day and night, sound effects, pause and saved mobile settings
        run: node tests/matrix/climate-sound-browser.mjs
      - name: Refined transport and building gallery
        run: npm run test:refined-transport-browser
      - name: Three.js live rendering and PWA offline restart
        run: npm run test:three-pwa-browser
      - name: Pause menu, persistent settings and mobile controls
        run: npm run test:menu-browser
      - name: Street materials, three camera views and walking contacts
        run: npm run test:street-graphics-browser
      - name: Three.js production Pages smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lowtown-three-preview.log 2>&1 &
          npm run test:pages-smoke
      - name: Three.js aerial city visual sweep
        run: npm run test:aerial-visual
      - name: Upload interaction matrix and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-interaction-world
          path: artifacts/interaction-world/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Three.js aerial screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-three-aerial
          path: artifacts/aerial-city/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload street graphics screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-street-graphics
          path: artifacts/street-graphics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload transport and facade screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-refined-transport
          path: artifacts/refined-transport/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload menu screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-game-menu
          path: artifacts/game-menu/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coastal release matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-coastal-weapons
          path: artifacts/coastal-weapons/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload living city upgrade matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-living-city-upgrade
          path: artifacts/living-city-1.1/
          if-no-files-found: ignore
          retention-days: 14
