name: LOWTOWN Three PWA

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - package.json
      - package-lock.json
      - public/manifest.webmanifest
      - public/pwa-icon.svg
      - public/sw.js
      - src/main.js
      - src/pwa.js
      - src/three/**
      - scripts/pwa-icons.mjs
      - vite.config.js
      - tests/three-city-geometry.mjs
      - tests/three-pwa-*.mjs
      - tests/street-*graphics*.mjs
      - .github/workflows/three-pwa.yml
  workflow_dispatch:

jobs:
  three-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:three-pwa-contract
      - run: node tests/three-city-geometry.mjs
      - run: npm run test:street-graphics
      - run: npx playwright install --with-deps chromium
      - name: Three.js live rendering and PWA offline restart
        run: npm run test:three-pwa-browser
      - name: Street materials, three camera views and walking contacts
        run: npm run test:street-graphics-browser
      - name: Three.js production Pages smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lowtown-three-preview.log 2>&1 &
          npm run test:pages-smoke
      - name: Three.js aerial city visual sweep
        run: npm run test:aerial-visual
      - name: Upload Three.js aerial screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-three-aerial
          path: artifacts/aerial-city/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload street graphics screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-street-graphics
          path: artifacts/street-graphics/
          if-no-files-found: ignore
          retention-days: 14
