name: LOWTOWN Bridge Cap Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - src/main.js
      - tests/bridge-cap-browser-benchmark.mjs
      - package.json
      - .github/workflows/bridge-cap-benchmark.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Compare bridge entry cap logic and rendering cost
        run: npm run test:bridge-caps
      - name: Upload benchmark report and matched frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtown-bridge-cap-benchmark
          path: |
            test-results/bridge-cap-benchmark.json
            test-results/bridge-caps-round.png
            test-results/bridge-caps-butt.png
          if-no-files-found: ignore
          retention-days: 14
